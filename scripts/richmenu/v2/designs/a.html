<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DK Rich Menu — Member First</title>
  <!--
    กติกาอ่านบนมือถือ: เมนูย่อเหลือ 400px (×0.16) → ข้อความทุกบรรทัด ≥ 88px (≈14px บนจอ)
    แต่ละช่อง = หัวข้อ + คำใบ้บรรทัดเดียว (แถวล่าง 3 ช่องคำใบ้ขนาดเท่ากัน 80px เส้นฐานตรงกัน · ช่องเกมคงคำว่า "ตอบถูก")
    ฟอนต์ = Noto Sans Thai ชุดเดียวกับสื่อพิมพ์ (หัวไม่มีห่วง) จาก scripts/richmenu/v2/fonts (สำเนาเดียวกับ _fonts ของชุดเปิดระบบสมาชิก)
    สี: พื้นแต่ละช่อง = ไล่แนวตั้งเรียบ ๆ ช่องละ 1 ชุด เจือสีประจำปุ่มจาง ๆ (แผนที่ส้มแดง · ติดต่อเขียว · เกมส้ม · Facebook ฟ้า · เว็บเขียวมิ้นต์)
        ไม่มีแสงวงกลมหลังไอคอนแล้ว (ดูเป็นรอยเรนเดอร์) · ไม่มีแถบเหลืองดำใต้ช่องบัตร
    บัตรตัวอย่างบนเมนู: ไม่ใส่ตัวเลขแต้ม (กันลูกค้าเข้าใจว่าเป็นยอดของตัวเอง) → เขียน "แต้มของคุณ"
    ข้อเท็จจริง: ทุก 100 บาท = 1 แต้ม (lib/points.ts) · บิลเชื่อ/ลูกค้าเครดิตไม่ได้แต้ม (hero_points_watch.js)
                เกม: ตอบถูกได้ 1 แต้ม สูงสุด 1 แต้ม/วัน (lib/quiz.ts · app/api/line-webhook/route.ts)
    ปุ่มกดไม่ใช่ตาราง 3×2 เดิม → ตอนตั้งเมนูต้องใช้ a.areas.json (ดู ../DEPLOY.md)
  -->
  <style>
    @font-face{font-family:"DK Thai";src:url("../fonts/NotoSansThai-Regular.ttf") format("truetype");font-weight:400}
    @font-face{font-family:"DK Thai";src:url("../fonts/NotoSansThai-Bold.ttf") format("truetype");font-weight:700}
    @font-face{font-family:"DK Latin";src:url("../fonts/NotoSans-Regular.ttf") format("truetype");font-weight:400}
    @font-face{font-family:"DK Latin";src:url("../fonts/NotoSans-Bold.ttf") format("truetype");font-weight:700}
    *{box-sizing:border-box}
    html,body{margin:0;width:2500px;height:1686px;overflow:hidden}
    body{font-family:"DK Thai","DK Latin",sans-serif;background:#061530;color:#fff}
    .canvas{position:relative;width:2500px;height:1686px;overflow:hidden;background:#061530}
    .btn{position:absolute;display:flex;align-items:center;isolation:isolate;overflow:hidden;--tile:#ffd400;--top:#0c2f63;--bot:#071d3c;background:linear-gradient(180deg,var(--top) 0%,var(--bot) 100%)}
    .btn>*{position:relative;z-index:2}

    /* ---- ช่องบัตรสมาชิก: น้ำเงินสว่างกว่าช่องอื่นชัดเจน · ไม่มีกรอบเหลือง · โลโก้ DK อยู่บนบัตร ---- */
    .member{left:0;top:0;width:1250px;height:1124px;padding:80px 80px 0;align-items:flex-start;flex-direction:column;
      background:radial-gradient(circle at 78% 62%,rgba(120,190,255,.45),transparent 52%),linear-gradient(150deg,#2f7bf0 0%,#1d5fd0 48%,#1447a6 100%);
      box-shadow:inset -8px 0 #061530,inset 0 -8px #061530}
    .member h1{margin:0;font-size:168px;line-height:1.02;font-weight:700;letter-spacing:-4px;text-shadow:0 6px 0 rgba(6,21,48,.35)}
    .member .sub{margin-top:14px;font-size:90px;line-height:1.2;font-weight:700;color:#fff;white-space:nowrap}
    .member .sub b{color:#ffd400}
    /* บัตรหน้าตาเดียวกับบัตรในแอป (app/liff/lib/tiers.ts: สี Gold) · เอียงแค่ 2.5° · กว้างเต็มช่องซ้าย */
    .member-card{position:absolute;left:80px;top:556px;width:1010px;height:262px;padding:40px 44px 40px 48px;border-radius:34px;
      background:linear-gradient(135deg,#FFD86B 0%,#FFC02E 45%,#F2A80C 100%);color:#2b1a0b;
      box-shadow:16px 18px 0 rgba(6,21,48,.55);transform:rotate(-2.5deg);display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto 1fr;column-gap:44px;align-items:center}
    .card-logo{grid-row:1/3;width:160px;height:127px;border-radius:16px;background:url("../../../../public/dk-logo.jpg") no-repeat;background-size:205.3px 205.3px;background-position:-20.1px -31.2px;box-shadow:0 0 0 5px #0b2d61}
    .card-tier{justify-self:end;align-self:start;font-size:64px;line-height:1;font-weight:700;color:#ffd400;background:#0b2d61;padding:14px 38px 16px;border-radius:40px}
    .card-points{grid-column:2;align-self:end;display:flex;align-items:center;gap:40px}
    .card-points strong{font-size:88px;line-height:1;font-weight:700;letter-spacing:-1px;white-space:nowrap}
    .card-bar{flex:1;height:26px;margin-top:10px;border-radius:13px;background:rgba(43,26,11,.18);overflow:hidden}
    .card-bar i{display:block;width:49%;height:100%;border-radius:13px;background:#0b2d61} /* แถบตกแต่ง: ในแอปคิดเป็น ยอดสะสม ÷ เกณฑ์ระดับถัดไป นับจาก 0 (app/liff/page.tsx) → 49% = ตัวอย่างยอดสะสม 2,450 ÷ Platinum 5,000 */
    .member .cta{position:absolute;left:80px;bottom:78px;display:flex;align-items:center;gap:26px;font-size:92px;line-height:1;font-weight:700;color:#071d3c;background:#ffd400;padding:34px 54px;border-radius:18px;box-shadow:10px 10px 0 #061530}
    .member .cta svg{width:70px;height:70px;fill:none;stroke:#0b2d61;stroke-width:10}

    /* ---- ช่องทั่วไป ---- */
    .standard{padding:58px 76px;gap:60px;justify-content:center}
    .standard .copy svg.chev{display:inline-block;width:.42em;height:.62em;margin-left:.22em;vertical-align:-.02em;overflow:visible;fill:none;stroke:currentColor;stroke-width:15;stroke-linecap:round;stroke-linejoin:round}
    .icon-wrap{width:190px;height:190px;flex:none;display:grid;place-items:center;background:var(--tile);border-radius:22px;box-shadow:10px 10px 0 #061530}
    .standard svg{width:116px;height:116px;fill:none;stroke:#0b2d61;stroke-width:10;stroke-linecap:round;stroke-linejoin:round}
    .standard svg .solid{fill:#0b2d61;stroke:none}
    .standard svg .cutout{fill:var(--tile);stroke:none}
    .copy h2{margin:0;font-size:112px;line-height:1.08;font-weight:700;letter-spacing:-2px;white-space:nowrap}
    .copy .action{margin-top:18px;font-size:90px;line-height:1.12;font-weight:700;color:#ffd400;white-space:nowrap}
    /* คอลัมน์ขวา: ไอคอน+ข้อความชิดซ้ายที่ x เดียวกันทั้ง 2 ช่อง (ไม่จัดกลางแยกช่อง ขอบจึงไม่แหว่ง) · แสงสีประจำปุ่มหลังไอคอน */
    .map,.contact{justify-content:flex-start;padding-left:110px;gap:52px}
    .map{left:1250px;top:0;width:1250px;height:562px;box-shadow:inset 0 -8px #061530;--tile:#FF7A59;--top:#342f66;--bot:#1d1a40}
    .contact{left:1250px;top:562px;width:1250px;height:562px;box-shadow:inset 0 -8px #061530;--tile:#3DDC84;--top:#124a66;--bot:#0a2f42}

    /* ---- แถวล่าง: พื้นเจือสีประจำปุ่ม · ไอคอน 180px (≈29px บนจอ 400px) ---- */
    /* จัดชิดบนเท่ากันทั้งแถว (ไอคอน/หัวข้อ/คำใบ้ อยู่เส้นฐานเดียวกัน) · คำใบ้บรรทัดเดียวทุกช่อง */
    .small{top:1124px;height:562px;padding:46px 20px 0;flex-direction:column;justify-content:flex-start;text-align:center;gap:24px}
    .small .icon-wrap{width:180px;height:180px}
    .small svg{width:114px;height:114px}
    .small .copy h2{font-size:104px;line-height:1.05}
    .small .copy .action{font-size:80px;line-height:1.08;margin-top:12px}
    .game{left:0;width:834px;box-shadow:inset -8px 0 #061530;--tile:#FFA23A;--top:#3d3558;--bot:#241d36}
    .facebook{left:834px;width:833px;box-shadow:inset -8px 0 #061530;--tile:#6FA8FF;--top:#1a4480;--bot:#102b52}
    .website{left:1667px;width:833px;--tile:#3FD9B4;--top:#124a6e;--bot:#0b3047}
  </style>
</head>
<body>
<main class="canvas">
  <section class="btn member">
    <h1>บัตรสมาชิก</h1>
    <div class="sub">สมัครฟรี · แลกของ</div>
    <div class="sub"><b>ทุก 100 บาท = 1 แต้ม</b></div>
    <div class="member-card" aria-hidden="true">
      <span class="card-logo"></span><span class="card-tier">Gold</span>
      <div class="card-points"><strong>แต้มของคุณ</strong><div class="card-bar"><i></i></div></div>
    </div>
    <div class="cta">เปิดบัตรของฉัน <svg viewBox="0 0 64 64"><path d="M10 32h42M37 17l15 15-15 15"/></svg></div>
  </section>
  <section class="btn standard map">
    <div class="icon-wrap"><svg viewBox="0 0 100 100"><path class="solid" d="M50 5C30 5 14 21 14 41c0 27 36 55 36 55s36-28 36-55C86 21 70 5 50 5Z"/><circle class="cutout" cx="50" cy="40" r="12"/></svg></div>
    <div class="copy"><h2>แผนที่ร้าน</h2><div class="action">ดูเส้นทางมาร้าน<svg class="chev" viewBox="0 0 40 64"><path d="M9 7l24 25-24 25"/></svg></div></div>
  </section>
  <section class="btn standard contact">
    <div class="icon-wrap"><svg viewBox="0 0 100 100"><path class="solid" d="M24 7h17l10 25-13 10c8 16 14 22 30 30l10-13 25 10v17c0 8-7 14-15 13C48 94 7 53 11 18 12 11 17 7 24 7Z"/></svg></div>
    <div class="copy"><h2>ติดต่อฝ่ายขาย</h2><div class="action">โทร / LINE<svg class="chev" viewBox="0 0 40 64"><path d="M9 7l24 25-24 25"/></svg></div></div>
  </section>
  <section class="btn standard small game">
    <div class="icon-wrap"><svg viewBox="0 0 100 100"><path d="M30 30h40c14 0 22 11 19 25l-6 31-20-18H37L17 86l-6-31c-3-14 5-25 19-25Z"/><path d="M31 47v18M22 56h18"/><circle class="solid" cx="66" cy="49" r="6"/><circle class="solid" cx="78" cy="62" r="6"/></svg></div>
    <div class="copy"><h2>เล่นเกมรับแต้ม</h2><div class="action">ตอบถูก +1 แต้ม/วัน</div></div>
  </section>
  <section class="btn standard small facebook">
    <div class="icon-wrap"><svg viewBox="0 0 100 100"><path class="solid" d="M61 98V59h14l4-17H61V32c0-8 4-13 14-13h8V4c-5-1-12-2-20-2-20 0-33 12-33 34v6H17v17h13v39Z"/></svg></div>
    <div class="copy"><h2>Facebook</h2><div class="action">ข่าวสาร DK<svg class="chev" viewBox="0 0 40 64"><path d="M9 7l24 25-24 25"/></svg></div></div>
  </section>
  <section class="btn standard small website">
    <div class="icon-wrap"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40"/><path d="M10 50h80M50 10c13 12 20 25 20 40S63 78 50 90C37 78 30 65 30 50s7-28 20-40Z"/></svg></div>
    <div class="copy"><h2>เว็บไซต์ร้าน</h2><div class="action">ดูสินค้า<svg class="chev" viewBox="0 0 40 64"><path d="M9 7l24 25-24 25"/></svg></div></div>
  </section>
</main>
</body>
</html>
